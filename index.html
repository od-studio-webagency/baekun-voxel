<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>백운고 몬스터 디펜스</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-state="menu">
  <div id="hurt"></div>

  <div id="start" class="overlay">
    <div class="card">
      <p class="eyebrow">광양백운고등학교</p>
      <h1>백운고 몬스터 디펜스</h1>
      <p class="sub">광양백운고를 지켜라!</p>
      <p class="help">이동 WASD · 시점 마우스 · 발사 클릭 · 점프 Space · 달리기 Shift · 일시정지 Esc</p>
      <p class="help touch-help">왼쪽 조이스틱 이동 · 오른쪽 드래그 시점 · 발사 버튼</p>
      <button id="btn-start" type="button">게임 시작</button>
      <p id="start-best" class="best"></p>
    </div>
  </div>

  <div id="hud">
    <div class="panel">
      <div>점수 <b id="hud-score">0</b></div>
      <div>웨이브 <b id="hud-wave">1</b></div>
      <div>남은 몬스터 <b id="hud-left">0</b></div>
    </div>
  </div>
  <div id="hpwrap">
    <div id="hpbar"><i id="hp-fill"></i></div>
    <span id="hp-text">HP 100</span>
  </div>

  <div id="edge-ind" aria-hidden="true"></div>
  <div id="crosshair" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div id="charge" class="hidden"><i id="charge-fill"></i></div>
  <div id="banner" class="hidden">웨이브 1!</div>
  <div id="popups"></div>
  <div id="fps" class="hidden">FPS 0</div>

  <div id="pause" class="overlay">
    <div class="card">
      <h2>일시정지</h2>
      <p class="help">광양백운고를 지켜라!</p>
      <button id="btn-resume" type="button">계속하기</button>
    </div>
  </div>

  <div id="over" class="overlay">
    <div class="card">
      <h2>게임 오버</h2>
      <p>최종 점수 <b id="over-score">0</b></p>
      <p>도달 웨이브 <b id="over-wave">1</b></p>
      <p>최고 점수 <b id="over-best">0</b></p>
      <button id="btn-retry" type="button">다시 하기</button>
    </div>
  </div>

  <div id="touch">
    <div id="joy" aria-hidden="true"><div id="knob"></div></div>
    <button id="fire" type="button">발사</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
